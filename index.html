<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
        }
        .balance-box {
            background-color: #2a2a2a;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
            color: #00c853;
            font-size: 16px;
        }
        .reset-btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .game-container {
            text-align: center;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .timer-box {
            font-size: 20px;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 10px;
            min-height: 30px;
        }
        .multiplier {
            font-size: 70px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 20px;
            transition: color 0.3s;
        }
        .multiplier.crashed {
            color: #ff4444;
        }
        .bet-input-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .bet-input {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 10px;
            width: 120px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        .action-btn {
            width: 90%;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            margin: 0 auto;
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-bet {
            background: linear-gradient(135deg, #1e90ff, #0056b3);
            box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4);
        }
        .btn-cashout {
            background: linear-gradient(135deg, #00c853, #009624);
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.4);
        }
        .status {
            margin-top: 15px;
            font-size: 15px;
            color: #aaaaaa;
            min-height: 20px;
        }
        .history-container {
            width: 95%;
            height: 28%;
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            margin: 0 auto 10px auto;
        }
        .history-title {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            text-align: right;
            padding-right: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background-color: #2a2a2a;
            border-radius: 10px;
            margin-bottom: 5px;
            font-size: 13px;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-name { color: #ccc; width: 30%; text-align: right; }
        .bet-amount { color: #ffcc00; width: 20%; text-align: center; }
        .multiplier-badge { padding: 3px 6px; border-radius: 5px; font-weight: bold; width: 22%; text-align: center; }
        .win { background-color: rgba(0, 200, 83, 0.2); color: #00c853; }
        .loss { background-color: rgba(255, 68, 68, 0.2); color: #ff4444; }
        .profit { width: 23%; text-align: left; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div style="font-size:14px;">💰 موجودی:</div>
        <div class="balance-box" id="balanceDisplay">100.00 TON</div>
        <button class="reset-btn" onclick="resetBalance()">🔄 شارژ مجدد</button>
    </div>

    <div class="game-container">
        <div class="timer-box" id="timerDisplay">⏳ منتظر شروع دور...</div>
        <div class="multiplier" id="multiplierDisplay">1.00x</div>
        
        <div class="bet-input-container">
            <input type="number" id="betInput" class="bet-input" placeholder="مبلغ شرط" value="10" min="1">
            <span style="padding-top:10px; color:#888;">TON</span>
        </div>

        <button class="action-btn btn-bet" id="actionButton">ورود به بازی (Join)</button>
        <div class="status" id="statusText">برای شروع، مبلغ را وارد کنید</div>
    </div>

    <div class="history-container">
        <div class="history-title">📊 شرط‌بندی‌های زنده (شبیه‌سازی)</div>
        <div id="historyList"></div>
    </div>

    <script>
        // --- متغیرهای اصلی ---
        let balance = parseFloat(localStorage.getItem('crashBalance_v3')) || 100.00;
        let gameState = 'waiting'; // waiting, playing, crashed
        let countdown = 5;
        let multiplier = 1.00;
        let crashPoint = 0;
        let myBet = 0;
        let hasJoined = false;
        let gameInterval;
        let countdownInterval;

        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const actionButton = document.getElementById('actionButton');
        const statusText = document.getElementById('statusText');
        const historyList = document.getElementById('historyList');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const betInput = document.getElementById('betInput');
        const timerDisplay = document.getElementById('timerDisplay');

        // --- مدیریت موجودی ---
        function updateBalanceUI() {
            balanceDisplay.innerText = balance.toFixed(2) + ' TON';
            localStorage.setItem('crashBalance_v3', balance);
        }
        updateBalanceUI();

        function resetBalance() {
            balance = 100.00;
            updateBalanceUI();
            statusText.innerText = '✅ موجودی شما به 100 TON شارژ شد!';
        }

        // --- لیست شرط‌بندی فیک ---
        const fakeNames = ['Ali', 'Reza', 'Sara', 'Mmd', 'Hossein', 'Zahra', 'Amir', 'Nima', 'Erfan', 'Melika'];

        function createFakeBet() {
            const name = fakeNames[Math.floor(Math.random() * fakeNames.length)] + Math.floor(Math.random() * 100);
            const amount = (Math.random() * 50 + 1).toFixed(2); 
            const multiplierValue = (Math.random() * 5 + 1).toFixed(2); 
            const isWin = Math.random() > 0.4; 

            let multiplierClass = isWin ? 'win' : 'loss';
            let multiplierText = isWin ? multiplierValue + 'x' : 'سقوط';
            let profit = isWin ? (amount * multiplierValue).toFixed(2) : '-' + amount;

            if (!isWin) multiplierText = '1.00x';

            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="user-name">${name}</div>
                <div class="bet-amount">${amount} TON</div>
                <div class="multiplier-badge ${multiplierClass}">${multiplierText}</div>
                <div class="profit" style="color: ${isWin ? '#00c853' : '#ff4444'}">${profit}</div>
            `;
            historyList.prepend(item);
            if (historyList.children.length > 20) historyList.removeChild(historyList.lastChild);
        }

        // شرط‌بندی‌های فیک فقط در زمان بازی ساخته میشن
        setInterval(() => {
            if (gameState === 'playing' && Math.random() > 0.5) createFakeBet();
        }, 1500);

        // --- منطق اصلی بازی ---

        // شروع یک دور جدید
        function startNewRound() {
            gameState = 'waiting';
            hasJoined = false;
            myBet = 0;
            countdown = 5;
            multiplier = 1.00;
            
            multiplierDisplay.innerText = '1.00x';
            multiplierDisplay.classList.remove('crashed');
            betInput.disabled = false;
            betInput.value = 10;
            
            actionButton.innerText = 'ورود به بازی (Join)';
            actionButton.className = 'action-btn btn-bet';
            actionButton.disabled = false;
            statusText.innerText = '⏳ برای ورود به بازی عجله کنید!';
            
            timerDisplay.innerText = `⏳ زمان باقیمانده: 5 ثانیه`;
            
            // شمارش معکوس
            countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    timerDisplay.innerText = `⏳ زمان باقیمانده: ${countdown} ثانیه`;
                } else {
                    clearInterval(countdownInterval);
                    startGameplay();
                }
            }, 1000);
        }

        // شروع فاز بازی (بالا رفتن ضریب)
        function startGameplay() {
            gameState = 'playing';
            timerDisplay.innerText = '';
            crashPoint = Math.random() * 8.9 + 1.1; 
            betInput.disabled = true;
            
            if (hasJoined) {
                statusText.innerText = `✅ شما با ${myBet} TON وارد شدید. ضریب در حال افزایش...`;
            } else {
                statusText.innerText = 'شما وارد بازی نشدید! تماشا کنید...';
            }
            
            // دکمه فقط برای کسانی که وارد شدن فعاله
            if (hasJoined) {
                actionButton.innerText = 'برداشت (Cash Out)';
                actionButton.className = 'action-btn btn-cashout';
                actionButton.disabled = false;
            } else {
                actionButton.innerText = 'وارد نشدید';
                actionButton.className = 'action-btn btn-bet';
                actionButton.disabled = true;
            }

            gameInterval = setInterval(() => {
                multiplier += 0.05; 
                
                if (multiplier >= crashPoint) {
                    // سقوط
                    clearInterval(gameInterval);
                    multiplierDisplay.innerText = crashPoint.toFixed(2) + 'x';
                    multiplierDisplay.classList.add('crashed');
                    gameState = 'crashed';
                    actionButton.disabled = true;
                    actionButton.innerText = 'دور بعد...';
                    actionButton.className = 'action-btn btn-bet';
                    
                    if (hasJoined) {
                        statusText.innerText = `💥 سقوط کرد! شما ${myBet} TON باختید.`;
                        addMyBetToHistory(false, 1.00);
                    } else {
                        statusText.innerText = `💥 سقوط در ${crashPoint.toFixed(2)}x!`;
                    }
                    
                    setTimeout(startNewRound, 2500); // دور بعدی بعد از 2.5 ثانیه
                } else {
                    multiplierDisplay.innerText = multiplier.toFixed(2) + 'x';
                }
            }, 50);
        }

        // ورود به بازی (Join)
        function joinGame() {
            if (gameState !== 'waiting') return;
            
            const amount = parseFloat(betInput.value);
            if (isNaN(amount) || amount < 1) {
                statusText.innerText = '❌ لطفاً یک مبلغ معتبر وارد کنید!';
                return;
            }
            if (amount > balance) {
                statusText.innerText = '❌ موجودی کافی نیست!';
                return;
            }
            
            hasJoined = true;
            myBet = amount;
            balance -= amount;
            updateBalanceUI();
            betInput.disabled = true;
            
            statusText.innerText = `✅ شما با ${amount} TON وارد بازی شدید! منتظر شروع...`;
            actionButton.innerText = 'منتظر شروع...';
            actionButton.disabled = true;
        }

        // برداشت (Cash Out)
        function cashOut() {
            if (!hasJoined || gameState !== 'playing') return;
            
            clearInterval(gameInterval);
            const winnings = myBet * multiplier;
            balance += winnings;
            updateBalanceUI();
            
            gameState = 'crashed'; // جلوگیری از برداشت دوباره
            actionButton.disabled = true;
            actionButton.innerText = 'دور بعد...';
            actionButton.className = 'action-btn btn-bet';
            
            statusText.innerText = `✅ بردید! ${myBet} × ${multiplier.toFixed(2)} = ${winnings.toFixed(2)} TON`;
            addMyBetToHistory(true, multiplier.toFixed(2));
            
            // منتظر بمان تا سقوط اعلام شود
        }

        // اضافه کردن شرط خودم به لیست
        function addMyBetToHistory(isWin, multiplierValue) {
            const amount = myBet;
            const profit = isWin ? (amount * multiplierValue).toFixed(2) : '-' + amount;
            let multiplierClass = isWin ? 'win' : 'loss';
            let multiplierText = isWin ? multiplierValue + 'x' : '1.00x';

            const item = document.createElement('div');
            item.className = 'history-item';
            item.style.border = '1px solid #ffcc00'; 
            item.innerHTML = `
                <div class="user-name" style="color:#ffcc00; font-weight:bold;">شما (You)</div>
                <div class="bet-amount">${amount.toFixed(2)} TON</div>
                <div class="multiplier-badge ${multiplierClass}">${multiplierText}</div>
                <div class="profit" style="color: ${isWin ? '#00c853' : '#ff4444'}">${profit}</div>
            `;
            historyList.prepend(item);
        }

        // --- شنونده رویداد کلیک دکمه ---
        actionButton.addEventListener('click', () => {
            if (gameState === 'waiting') {
                joinGame();
            } else if (gameState === 'playing' && hasJoined) {
                cashOut();
            }
        });

        // شروع اولین دور
        startNewRound();

    </script>
</body>
</html>
