<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ebic Gift</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#0a0d14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;transition:transform .3s,opacity .3s;overflow:hidden}
.screen.hidden{transform:translateX(100%);opacity:0;pointer-events:none}

/* ===== HOME ===== */
#homeScreen{background:radial-gradient(circle at 50% 0%,#1a1f3a 0%,#0a0d14 60%);overflow-y:auto;padding-bottom:90px;padding-top:20px}

.balance-row{display:flex;align-items:center;padding:12px 16px 18px;gap:12px}
.avatar-wrap{position:relative;width:52px;height:52px;flex-shrink:0}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2ff0e0,#1e9cff);display:flex;justify-content:center;align-items:center;font-size:22px;font-weight:800;box-shadow:0 0 0 2px rgba(47,240,224,.4),0 0 20px rgba(47,240,224,.3)}
.avatar-badge{position:absolute;bottom:-2px;right:-4px;font-size:14px;background:#0a0d14;border-radius:50%;width:20px;height:20px;display:flex;justify-content:center;align-items:center}
.balance-info{flex:1}
.balance-label{font-size:12px;color:#7a8299;margin-bottom:4px}
.balance-value{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.ton-icon{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#0098ea,#0072ff);display:flex;justify-content:center;align-items:center;font-size:13px;font-weight:800;box-shadow:0 0 10px rgba(0,152,234,.5)}
.deposit-btn{background:linear-gradient(135deg,#9b5cff,#7c3aed);color:#fff;border:none;padding:11px 18px;border-radius:14px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 20px rgba(124,58,237,.5)}

.banners{padding:20px 14px 0;display:flex;flex-direction:column;gap:14px}
.banner{border-radius:22px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:0 10px 30px rgba(0,0,0,.5);min-height:110px;direction:ltr}
.banner:active{transform:scale(.98)}
.banner-badge{position:absolute;top:14px;left:16px;background:rgba(255,255,255,.95);color:#333;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:10}
.banner-title{position:absolute;bottom:16px;left:20px;font-size:24px;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px;text-shadow:0 2px 10px rgba(0,0,0,.4);z-index:10;letter-spacing:.5px}

.rocket-banner{background:radial-gradient(circle at 75% 50%,rgba(255,255,255,.3) 0%,transparent 45%),linear-gradient(135deg,#4aa8ff 0%,#6bb8ff 50%,#3d8ce8 100%);min-height:130px}
.rocket-scene{position:absolute;right:0;top:0;bottom:0;width:55%;pointer-events:none}
.rocket-ship{position:absolute;right:20px;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:74px;line-height:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.4)) drop-shadow(0 0 30px rgba(255,200,100,.5));animation:rocketFloat 2.5s ease-in-out infinite;z-index:2}
@keyframes rocketFloat{0%,100%{transform:translateY(-50%) rotate(-8deg)}50%{transform:translateY(-58%) rotate(-6deg)}}
.mult-pill{position:absolute;padding:5px 10px;border-radius:10px;font-size:12px;font-weight:900;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.3);animation:pillFloat 3s ease-in-out infinite;z-index:3}
.mult-pill.green{background:linear-gradient(135deg,#2ff068,#00b848)}
.mult-pill.yellow{background:linear-gradient(135deg,#ffcb2b,#ff9d00)}
.mult-pill.red{background:linear-gradient(135deg,#ff5c5c,#d92b2b)}
.pm-1{top:14px;right:90px}
.pm-2{top:55px;right:130px;animation-delay:.6s}
.pm-3{bottom:14px;right:70px;animation-delay:1.2s}
@keyframes pillFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}

.pvp-banner{background:linear-gradient(135deg,#ffc14d 0%,#ff9d3d 100%)}
.pvp-players{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:6px;z-index:2}
.pvp-card{width:60px;height:80px;border-radius:14px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
.pvp-card .pc-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6b7280,#374151);display:flex;justify-content:center;align-items:center;font-size:15px;border:2px solid rgba(255,255,255,.3)}
.pvp-card .pc-name{font-size:8px;font-weight:800;color:#fff;text-transform:uppercase}
.pvp-card .pc-pct{font-size:10px;font-weight:800;color:#4ade80}

.playhub-banner{background:linear-gradient(135deg,#6a1b9a 0%,#3d0a63 100%);min-height:120px}
.game-cards{position:absolute;right:-10px;top:0;bottom:0;display:flex;align-items:center;z-index:2;pointer-events:none}
.game-card{width:78px;height:90px;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:34px;flex-shrink:0;box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 0 20px rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);margin-left:-30px;transform:rotate(-8deg);position:relative}
.gc-upgrade{background:linear-gradient(135deg,#2ff068,#00a03d);z-index:3}
.gc-crash{background:linear-gradient(135deg,#ff5c5c,#b91c1c);z-index:2}
.gc-plinko{background:linear-gradient(135deg,#c084fc,#7c3aed);z-index:1}
.game-card-label{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6)}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:rgba(15,18,28,.95);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;border-top:1px solid rgba(255,255,255,.08);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:#5a6278;font-size:10px;cursor:pointer;font-weight:600}
.nav-item.active{color:#fff}
.nav-item.active .nav-icon{background:linear-gradient(135deg,#9b5cff,#7c3aed);padding:8px 12px;border-radius:14px;box-shadow:0 4px 15px rgba(124,58,237,.5)}
.nav-icon{font-size:22px}

/* ===== GAME ===== */
#gameScreen{background:#121212;z-index:200}
.game-top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:#1e1e1e;border-bottom:1px solid #333;flex-shrink:0;z-index:10}
.back-btn{background:#333;color:#fff;border:none;padding:8px 15px;border-radius:8px;font-size:14px;cursor:pointer}
.game-balance{background:#2a2a2a;padding:8px 15px;border-radius:10px;font-weight:bold;color:#00c853;font-size:16px}
.reset-btn{background:#444;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.multiplier-history{display:flex;align-items:center;overflow-x:auto;padding:8px 10px;gap:8px;background:#1a1a1a;border-bottom:1px solid #333;white-space:nowrap;min-height:45px;flex-shrink:0;z-index:10;direction:ltr}
.history-badge{padding:5px 12px;border-radius:15px;font-size:13px;font-weight:bold;background:#2a2a2a;color:#ccc;flex-shrink:0}
.history-badge.red{background:rgba(255,68,68,.2);color:#ff4444;border:1px solid rgba(255,68,68,.4)}
.history-badge.green{background:rgba(0,200,83,.2);color:#00c853;border:1px solid rgba(0,200,83,.4)}
.history-badge.blue{background:rgba(30,144,255,.2);color:#1e90ff;border:1px solid rgba(30,144,255,.4)}
.history-badge.purple{background:rgba(156,39,176,.2);color:#9c27b0;border:1px solid rgba(156,39,176,.4)}
.history-badge.yellow{background:rgba(255,204,0,.2);color:#ffcc00;border:1px solid rgba(255,204,0,.4)}
.chart-container{width:100%;height:180px;background:#0a0a0a;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;flex-shrink:0}
#chartCanvas{width:100%;height:100%}
.multiplier-text{position:absolute;font-size:60px;font-weight:bold;color:#ffcc00;z-index:10;text-shadow:0 0 20px rgba(0,0,0,.8);transition:all .3s}
.multiplier-text.crashed{color:#ff4444}
.multiplier-text.counting{color:#ff9800;font-size:100px;text-shadow:0 0 30px rgba(255,152,0,.8)}
.bet-controls{padding:12px 15px;display:flex;flex-direction:column;gap:8px;background:#1e1e1e;border-top:1px solid #333;border-bottom:1px solid #333;flex-shrink:0;z-index:10}
.bet-input-row{display:flex;justify-content:center;align-items:center;gap:10px}
.input-label{font-size:13px;color:#aaa;width:75px;text-align:right}
.bet-input{background:#2a2a2a;border:1px solid #444;color:#fff;padding:10px;border-radius:10px;width:130px;text-align:center;font-size:15px;font-weight:bold;user-select:text!important;-webkit-user-select:text!important}
.auto-cashout-input{border:2px solid #00c853!important;background:#0d1f0d!important;color:#00c853!important}
.action-btn{width:100%;padding:15px;font-size:20px;font-weight:bold;border:none;border-radius:12px;cursor:pointer;transition:all .2s;color:#fff;margin-top:3px}
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.btn-bet{background:linear-gradient(135deg,#1e90ff,#0056b3)}
.btn-cashout{background:linear-gradient(135deg,#00c853,#009624)}
.history-container{flex:1;min-height:0;overflow-y:auto;padding:10px;background:#121212;z-index:10}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#1e1e1e;border-radius:10px;margin-bottom:5px;font-size:13px;border:1px solid #2a2a2a}
.user-info{display:flex;align-items:center;gap:8px;flex-grow:1}
.avatar-small{font-size:22px}
.user-name{color:#ccc;font-weight:bold;font-size:13px}
.bet-amount{color:#ffcc00;margin-left:auto;padding-left:10px;font-size:13px}
.multiplier-badge{padding:4px 8px;border-radius:5px;font-weight:bold;min-width:55px;text-align:center;font-size:12px}
.win{background:rgba(0,200,83,.2);color:#00c853}
.loss{background:rgba(255,68,68,.2);color:#ff4444}
.profit{width:65px;text-align:left;font-weight:bold;font-size:13px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease-in-out}
</style>
</head>
<body>

<!-- ===== HOME SCREEN ===== -->
<div id="homeScreen" class="screen">

    <!-- Balance Row -->
    <div class="balance-row">
        <div class="avatar-wrap">
            <div class="avatar">M</div>
            <div class="avatar-badge">💎</div>
        </div>
        <div class="balance-info">
            <div class="balance-label">Your balance</div>
            <div class="balance-value">
                <span class="ton-icon">◈</span>
                <span id="homeBalance">238.470</span>
            </div>
        </div>
        <button class="deposit-btn">💳 Deposit</button>
    </div>

    <!-- Banners -->
    <div class="banners">

        <!-- ROCKET -->
        <div class="banner rocket-banner" onclick="openGame()">
            <div class="banner-badge">⚡ HOT!</div>
            <div class="banner-title">🚀 ROCKET</div>
            <div class="rocket-scene">
                <div class="rocket-ship">🚀</div>
                <div class="mult-pill green pm-1">x4.24</div>
                <div class="mult-pill yellow pm-2">x2.02</div>
                <div class="mult-pill red pm-3">x1.24</div>
            </div>
        </div>

        <!-- PVP -->
        <div class="banner pvp-banner">
            <div class="banner-badge">🔥 NEW!</div>
            <div class="banner-title">⚔️ PVP</div>
            <div class="pvp-players">
                <div class="pvp-card"><div class="pc-av">🦁</div><div class="pc-name">CRYPTO</div><div class="pc-pct">7.0%</div></div>
                <div class="pvp-card"><div class="pc-av">🧔</div><div class="pc-name">DEGEN</div><div class="pc-pct">6.8%</div></div>
                <div class="pvp-card"><div class="pc-av">👨</div><div class="pc-name">MIKE_K</div><div class="pc-pct">4.7%</div></div>
            </div>
        </div>

        <!-- PLAY HUB -->
        <div class="banner playhub-banner">
            <div class="banner-badge">🔥 HOT</div>
            <div class="banner-title">🎮 PLAY HUB</div>
            <div class="game-cards">
                <div class="game-card gc-upgrade">⬆️<div class="game-card-label">Upgrade</div></div>
                <div class="game-card gc-crash">🚀<div class="game-card-label">Crash</div></div>
                <div class="game-card gc-plinko">🎯<div class="game-card-label">Plinko</div></div>
            </div>
        </div>

    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item"><div class="nav-icon">🎒</div><span>Backpack</span></div>
        <div class="nav-item"><div class="nav-icon">👥</div><span>Invite</span></div>
        <div class="nav-item active"><div class="nav-icon">🏠</div><span>Home</span></div>
        <div class="nav-item"><div class="nav-icon">🏆</div><span>Leaderboard</span></div>
        <div class="nav-item"><div class="nav-icon">💰</div><span>Earn</span></div>
    </div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="gameScreen" class="screen hidden">
    <div class="game-top-bar">
        <button class="back-btn" onclick="goHome()">⬅ بازگشت</button>
        <div class="game-balance" id="balanceDisplay">100.00 TON</div>
        <button class="reset-btn" onclick="resetBalance()">🔄 شارژ</button>
    </div>
    <div class="multiplier-history" id="multiplierHistory"><div style="font-size:12px;color:#666;padding-left:10px">تاریخچه:</div></div>
    <div class="chart-container">
        <div class="multiplier-text" id="multiplierDisplay">1.00x</div>
        <canvas id="chartCanvas"></canvas>
    </div>
    <div class="bet-controls">
        <div class="bet-input-row">
            <span class="input-label">مبلغ شرط:</span>
            <input type="number" id="betInput" class="bet-input" value="10" min="1">
            <span style="color:#888;font-size:13px">TON</span>
        </div>
        <div class="bet-input-row">
            <span class="input-label">برداشت خودکار:</span>
            <input type="number" id="autoCashoutInput" class="bet-input auto-cashout-input" value="2.00" min="1.01" step="0.1">
            <span style="color:#00c853;font-weight:bold;font-size:13px">x</span>
        </div>
        <button class="action-btn btn-bet" id="actionButton">ورود به بازی (Join)</button>
        <div style="text-align:center;font-size:13px;color:#aaa;min-height:18px" id="statusText">برای شروع، مبلغ را وارد کنید</div>
    </div>
    <div class="history-container" id="historyList"></div>
</div>

<script>
function openGame(){
    document.getElementById('homeScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
}
function goHome(){
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('homeScreen').classList.remove('hidden');
}

let balance = parseFloat(localStorage.getItem('crashBalance_home')) || 100.00;
let gameState='waiting', multiplier=1.00, crashPoint=0, myBet=0, myAutoCashout=0, hasJoined=false;
let gameInterval, countdownInterval, roundHistory=[], players=[];

const multiplierDisplay=document.getElementById('multiplierDisplay');
const actionButton=document.getElementById('actionButton');
const statusText=document.getElementById('statusText');
const historyList=document.getElementById('historyList');
const balanceDisplay=document.getElementById('balanceDisplay');
const betInput=document.getElementById('betInput');
const autoCashoutInput=document.getElementById('autoCashoutInput');
const multiplierHistoryContainer=document.getElementById('multiplierHistory');
const homeBalanceEl=document.getElementById('homeBalance');
const canvas=document.getElementById('chartCanvas');
const ctx=canvas.getContext('2d');

function resizeCanvas(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight}
window.addEventListener('resize',resizeCanvas);resizeCanvas();

function updateBalanceUI(){
    balanceDisplay.innerText=balance.toFixed(2)+' TON';
    if(homeBalanceEl) homeBalanceEl.innerText=balance.toFixed(3);
    localStorage.setItem('crashBalance_home',balance);
}
updateBalanceUI();

function resetBalance(){balance=100.00;updateBalanceUI();statusText.innerText='✅ موجودی شما به 100 TON شارژ شد!'}

let multiplierBag=[];
const bagCounts={yellow:3,purple:4,blue:8,green:12,red:4};
function fillBag(){
    multiplierBag=[];
    for(let t in bagCounts) for(let i=0;i<bagCounts[t];i++) multiplierBag.push(t);
    for(let i=multiplierBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[multiplierBag[i],multiplierBag[j]]=[multiplierBag[j],multiplierBag[i]]}
}
function getNextMultiplierType(){if(multiplierBag.length===0)fillBag();return multiplierBag.pop()}
function getRandomCrashPoint(){
    const t=getNextMultiplierType();
    if(t==='yellow') return 10+Math.random()*40;
    if(t==='purple') return 5+Math.random()*4.99;
    if(t==='blue') return 2+Math.random()*2.99;
    if(t==='green') return 1.2+Math.random()*0.79;
    if(t==='red') return 1.01+Math.random()*0.18;
    return 1.01;
}
function getBadgeColorClass(m){
    if(m>=10) return 'yellow';
    if(m>=5) return 'purple';
    if(m>=2) return 'blue';
    if(m>=1.2) return 'green';
    return 'red';
}
function addRoundToHistory(c){
    roundHistory.unshift(c); if(roundHistory.length>15) roundHistory.pop(); renderRoundHistory();
}
function renderRoundHistory(){
    multiplierHistoryContainer.innerHTML='<div style="font-size:12px;color:#666;padding-left:10px">تاریخچه:</div>';
    roundHistory.forEach(m=>{
        const b=document.createElement('div');
        b.className='history-badge '+getBadgeColorClass(m);
        b.innerText=m.toFixed(2)+'x';
        multiplierHistoryContainer.appendChild(b);
    });
}
function drawChart(cm){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const max=Math.max(crashPoint,cm,2);
    const sx=20,sy=canvas.height-20,ex=canvas.width-20;
    const p=cm/max;
    const cx=sx+(ex-sx)*p;
    const cy=sy-(sy-20)*(cm/max);
    ctx.beginPath();ctx.moveTo(sx,sy);
    ctx.quadraticCurveTo(sx+(cx-sx)*0.5,sy,cx,cy);
    ctx.strokeStyle='#ffcc00';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
    ctx.shadowBlur=15;ctx.shadowColor='#ffcc00';ctx.stroke();ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
}
function clearChart(){ctx.clearRect(0,0,canvas.width,canvas.height);drawChart(1)}

const fakeNames=['Ali','Reza','Sara','Mmd','Hossein','Zahra','Amir','Nima','Erfan','Melika','Kian','Matin','Yasin','Arya'];
const fakeAvatars=['🐸','🐱','⚽','🦊','🐻','🐼','🦁','🐯','🐨','🐵'];

function addPlayer(name,amount,isMe=false){
    const avatar=isMe?'👤':fakeAvatars[Math.floor(Math.random()*fakeAvatars.length)];
    players.push({id:Date.now()+Math.random(),name,amount,avatar,isMe,cashedOut:false,lost:false});
    if(players.length>15){const idx=players.findIndex(p=>!p.isMe); if(idx!==-1) players.splice(idx,1)}
    renderPlayers();
}
function renderPlayers(){
    historyList.innerHTML='';
    if(players.length===0){historyList.innerHTML='<div style="text-align:center;color:#666;padding:20px;font-size:13px">در انتظار ورود بازیکنان...</div>';return}
    [...players].reverse().forEach(p=>{
        const item=document.createElement('div');
        item.className='history-item fade-in';
        if(p.isMe) item.style.border='1px solid #ffcc00';
        let mT='-',mC='',pT='-',pC='#ccc';
        if(p.cashedOut){mT=p.cashoutMultiplier.toFixed(2)+'x';mC='win';pT='+'+(p.amount*p.cashoutMultiplier).toFixed(2);pC='#00c853'}
        else if(p.lost){mT='باخت';mC='loss';pT='-'+p.amount.toFixed(2);pC='#ff4444'}
        item.innerHTML=`<div class="user-info"><span class="avatar-small">${p.avatar}</span><span class="user-name">${p.name}</span></div><div class="bet-amount">${p.amount.toFixed(2)} TON</div><div class="multiplier-badge ${mC}">${mT}</div><div class="profit" style="color:${pC}">${pT}</div>`;
        historyList.appendChild(item);
    });
}
function updatePlayersOnCrash(){players.forEach(p=>{if(!p.cashedOut)p.lost=true});renderPlayers()}

setInterval(()=>{
    if(gameState==='playing'&&Math.random()>0.85){
        addPlayer(fakeNames[Math.floor(Math.random()*fakeNames.length)]+Math.floor(Math.random()*100),Math.random()*50+1);
    }
},1200);

function startNewRound(){
    gameState='waiting';hasJoined=false;myBet=0;myAutoCashout=0;players=[];
    addPlayer('ربات پشتیبان',10.00);
    multiplier=1.00;crashPoint=getRandomCrashPoint();
    clearChart();
    multiplierDisplay.classList.remove('crashed');multiplierDisplay.classList.add('counting');
    betInput.disabled=false;autoCashoutInput.disabled=false;
    betInput.value=parseFloat(localStorage.getItem('lastBet'))||10;
    autoCashoutInput.value=parseFloat(localStorage.getItem('lastAuto'))||2.00;
    actionButton.innerText='ورود به بازی (Join)';actionButton.className='action-btn btn-bet';actionButton.disabled=false;
    statusText.innerText='برای ورود به بازی عجله کنید!';
    let countdown=5;multiplierDisplay.innerText=countdown;
    countdownInterval=setInterval(()=>{
        countdown--;
        if(countdown>0) multiplierDisplay.innerText=countdown;
        else{clearInterval(countdownInterval);multiplierDisplay.classList.remove('counting');multiplierDisplay.innerText='1.00x';startGameplay()}
    },1000);
}

function startGameplay(){
    gameState='playing';betInput.disabled=true;autoCashoutInput.disabled=true;
    if(hasJoined){
        statusText.innerText=`✅ شما با ${myBet} TON وارد شدید.`;
        actionButton.innerText='برداشت دستی (Cash Out)';
        actionButton.className='action-btn btn-cashout';actionButton.disabled=false;
    } else {
        statusText.innerText='شما وارد بازی نشدید! تماشا کنید...';
        actionButton.innerText='وارد نشدید';actionButton.className='action-btn btn-bet';actionButton.disabled=true;
    }
    for(let i=0;i<2;i++) addPlayer(fakeNames[Math.floor(Math.random()*fakeNames.length)]+Math.floor(Math.random()*100),Math.random()*50+1);

    let elapsed=0;
    gameInterval=setInterval(()=>{
        elapsed+=80;
        multiplier=Math.pow(1.0007,elapsed);
        multiplierDisplay.innerText=multiplier.toFixed(2)+'x';
        drawChart(multiplier);
        if(hasJoined&&myAutoCashout>1&&multiplier>=myAutoCashout) cashOut(true);
        players.forEach(p=>{
            if(!p.isMe&&!p.cashedOut&&!p.lost&&Math.random()>0.97){p.cashedOut=true;p.cashoutMultiplier=multiplier;renderPlayers()}
        });
        if(multiplier>=crashPoint){
            clearInterval(gameInterval);
            multiplierDisplay.innerText=crashPoint.toFixed(2)+'x';
            multiplierDisplay.classList.add('crashed');
            gameState='crashed';actionButton.disabled=true;actionButton.innerText='دور بعد...';actionButton.className='action-btn btn-bet';
            addRoundToHistory(crashPoint);
            statusText.innerText=hasJoined?`💥 سقوط کرد! شما ${myBet} TON باختید.`:`💥 سقوط در ${crashPoint.toFixed(2)}x!`;
            updatePlayersOnCrash();
            setTimeout(startNewRound,2500);
        }
    },80);
}

function joinGame(){
    if(gameState!=='waiting') return;
    const amount=parseFloat(betInput.value);
    if(isNaN(amount)||amount<1){statusText.innerText='❌ لطفاً یک مبلغ معتبر وارد کنید!';return}
    if(amount>balance){statusText.innerText='❌ موجودی کافی نیست!';return}
    hasJoined=true;myBet=amount;
    myAutoCashout=parseFloat(autoCashoutInput.value);
    if(isNaN(myAutoCashout)||myAutoCashout<1.01) myAutoCashout=0;
    localStorage.setItem('lastBet',amount);
    localStorage.setItem('lastAuto',myAutoCashout||2.00);
    balance-=amount;updateBalanceUI();
    betInput.disabled=true;autoCashoutInput.disabled=true;
    addPlayer('شما (You)',amount,true);
    statusText.innerText=myAutoCashout>0?`✅ وارد شدید. برداشت خودکار در ${myAutoCashout.toFixed(2)}x`:`✅ وارد شدید! منتظر شروع...`;
    actionButton.innerText='منتظر شروع...';actionButton.disabled=true;
}

function cashOut(isAuto=false){
    if(!hasJoined||gameState!=='playing') return;
    const winnings=myBet*multiplier;
    balance+=winnings;updateBalanceUI();
    hasJoined=false;actionButton.disabled=true;actionButton.innerText='دور بعد...';actionButton.className='action-btn btn-bet';
    statusText.innerText=isAuto?`🤖 برداشت خودکار در ${multiplier.toFixed(2)}x! سود: ${winnings.toFixed(2)} TON`:`✅ بردید! ${myBet} × ${multiplier.toFixed(2)} = ${winnings.toFixed(2)} TON`;
    const mp=players.find(p=>p.isMe);
    if(mp){mp.cashedOut=true;mp.cashoutMultiplier=multiplier;renderPlayers()}
}

actionButton.addEventListener('click',()=>{
    if(gameState==='waiting') joinGame();
    else if(gameState==='playing'&&hasJoined) cashOut(false);
});

startNewRound();
</script>
