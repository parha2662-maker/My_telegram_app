<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
        }
        .balance-box {
            background-color: #2a2a2a;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
            color: #00c853;
            font-size: 18px;
        }
        .game-container {
            text-align: center;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .multiplier {
            font-size: 70px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 20px;
            transition: color 0.3s;
        }
        .multiplier.crashed {
            color: #ff4444;
        }
        .bet-input-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .bet-input {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 10px;
            width: 120px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
        .action-btn {
            width: 90%;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            margin: 0 auto;
        }
        .btn-bet {
            background: linear-gradient(135deg, #1e90ff, #0056b3);
            box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4);
        }
        .btn-cashout {
            background: linear-gradient(135deg, #00c853, #009624);
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.4);
        }
        .status {
            margin-top: 15px;
            font-size: 16px;
            color: #aaaaaa;
        }
        /* استایل لیست شرط‌بندی‌ها */
        .history-container {
            width: 95%;
            height: 30%;
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            margin: 0 auto 10px auto;
        }
        .history-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            text-align: right;
            padding-right: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background-color: #2a2a2a;
            border-radius: 10px;
            margin-bottom: 5px;
            font-size: 14px;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-name { color: #ccc; width: 30%; text-align: right; }
        .bet-amount { color: #ffcc00; width: 20%; text-align: center; }
        .multiplier-badge { padding: 3px 8px; border-radius: 5px; font-weight: bold; width: 20%; text-align: center; }
        .win { background-color: rgba(0, 200, 83, 0.2); color: #00c853; }
        .loss { background-color: rgba(255, 68, 68, 0.2); color: #ff4444; }
        .profit { width: 25%; text-align: left; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>💰 موجودی شما:</div>
        <div class="balance-box" id="balanceDisplay">1000.00 TON</div>
    </div>

    <div class="game-container">
        <div class="multiplier" id="multiplierDisplay">1.00x</div>
        
        <div class="bet-input-container">
            <input type="number" id="betInput" class="bet-input" placeholder="مبلغ شرط" value="10" min="1">
            <span style="padding-top:10px; color:#888;">TON</span>
        </div>

        <button class="action-btn btn-bet" id="actionButton">شروع شرط‌بندی (Place Bet)</button>
        <div class="status" id="statusText">مبلغ شرط رو وارد کنید و شروع کنید</div>
    </div>

    <div class="history-container">
        <div class="history-title">📊 شرط‌بندی‌های زنده (شبیه‌سازی)</div>
        <div id="historyList"></div>
    </div>

    <script>
        // لود کردن موجودی از حافظه مرورگر یا مقدار پیش‌فرض 1000
        let balance = parseFloat(localStorage.getItem('crashBalance')) || 1000.00;
        let multiplier = 1.00;
        let isPlaying = false;
        let interval;
        let crashPoint = 0;
        let currentBet = 0;

        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const actionButton = document.getElementById('actionButton');
        const statusText = document.getElementById('statusText');
        const historyList = document.getElementById('historyList');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const betInput = document.getElementById('betInput');

        // آپدیت کردن نمایش موجودی
        function updateBalanceUI() {
            balanceDisplay.innerText = balance.toFixed(2) + ' TON';
            localStorage.setItem('crashBalance', balance); // ذخیره در حافظه
        }
        updateBalanceUI(); // اجرا در شروع

        const fakeNames = ['Ali', 'Reza', 'Sara', 'Mmd', 'Hossein', 'Zahra', 'Amir', 'Nima', 'Erfan', 'Melika'];

        function createFakeBet() {
            const name = fakeNames[Math.floor(Math.random() * fakeNames.length)] + Math.floor(Math.random() * 100);
            const amount = (Math.random() * 50 + 1).toFixed(2); 
            const multiplierValue = (Math.random() * 5 + 1).toFixed(2); 
            const isWin = Math.random() > 0.4; 

            let multiplierClass = isWin ? 'win' : 'loss';
            let multiplierText = isWin ? multiplierValue + 'x' : 'سقوط';
            let profit = isWin ? (amount * multiplierValue).toFixed(2) : '-' + amount;

            if (!isWin) multiplierText = '1.00x';

            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="user-name">${name}</div>
                <div class="bet-amount">${amount} TON</div>
                <div class="multiplier-badge ${multiplierClass}">${multiplierText}</div>
                <div class="profit" style="color: ${isWin ? '#00c853' : '#ff4444'}">${profit}</div>
            `;
            historyList.prepend(item);
            if (historyList.children.length > 20) historyList.removeChild(historyList.lastChild);
        }

        setInterval(() => {
            if (Math.random() > 0.3) createFakeBet();
        }, Math.random() * 2000 + 2000);

        actionButton.addEventListener('click', () => {
            if (!isPlaying) {
                startGame();
            } else {
                cashOut();
            }
        });

        function startGame() {
            // خواندن مبلغ شرط از اینپوت
            currentBet = parseFloat(betInput.value);
            
            // اعتبارسنجی شرط
            if (isNaN(currentBet) || currentBet < 1) {
                statusText.innerText = "❌ لطفاً یک مبلغ معتبر وارد کنید!";
                return;
            }
            if (currentBet > balance) {
                statusText.innerText = "❌ موجودی کافی نیست!";
                return;
            }
            
            // کم کردن شرط از موجودی
            balance -= currentBet;
            updateBalanceUI();
            betInput.disabled = true; // قفل کردن اینپوت در حین بازی

            isPlaying = true;
            multiplier = 1.00;
            crashPoint = Math.random() * 8.9 + 1.1; // نقطه سقوط تصادفی
            
            multiplierDisplay.innerText = multiplier.toFixed(2) + 'x';
            multiplierDisplay.classList.remove('crashed');
            actionButton.innerText = 'برداشت (Cash Out)';
            actionButton.className = 'action-btn btn-cashout';
            statusText.innerText = `شرط شما: ${currentBet} TON. منتظر بمانید...`;

            interval = setInterval(() => {
                multiplier += 0.05; 
                
                if (multiplier >= crashPoint) {
                    // باخت
                    clearInterval(interval);
                    multiplierDisplay.innerText = crashPoint.toFixed(2) + 'x';
                    multiplierDisplay.classList.add('crashed');
                    isPlaying = false;
                    actionButton.innerText = 'شروع مجدد (Place Bet)';
                    actionButton.className = 'action-btn btn-bet';
                    statusText.innerText = '💥 سقوط کرد! شما باختید.';
                    betInput.disabled = false; // باز کردن اینپوت
                    addMyBetToHistory(false, 1.00); 
                } else {
                    multiplierDisplay.innerText = multiplier.toFixed(2) + 'x';
                }
            }, 50);
        }

        function cashOut() {
            // برد
            clearInterval(interval);
            isPlaying = false;
            betInput.disabled = false; // باز کردن اینپوت

            const profit = currentBet * multiplier;
            balance += profit; // اضافه کردن سود به موجودی
            updateBalanceUI();

            actionButton.innerText = 'شروع مجدد (Place Bet)';
            actionButton.className = 'action-btn btn-bet';
            statusText.innerText = `✅ بردید! ضریب: ${multiplier.toFixed(2)}x - سود: ${profit.toFixed(2)} TON`;
            addMyBetToHistory(true, multiplier.toFixed(2)); 
        }

        function addMyBetToHistory(isWin, multiplierValue) {
            const amount = currentBet;
            const profit = isWin ? (amount * multiplierValue).toFixed(2) : '-' + amount;
            let multiplierClass = isWin ? 'win' : 'loss';
            let multiplierText = isWin ? multiplierValue + 'x' : '1.00x';

            const item = document.createElement('div');
            item.className = 'history-item';
            item.style.border = '1px solid #ffcc00'; 
            item.innerHTML = `
                <div class="user-name" style="color:#ffcc00; font-weight:bold;">شما (You)</div>
                <div class="bet-amount">${amount.toFixed(2)} TON</div>
                <div class="multiplier-badge ${multiplierClass}">${multiplierText}</div>
                <div class="profit" style="color: ${isWin ? '#00c853' : '#ff4444'}">${profit}</div>
            `;
            historyList.prepend(item);
        }
    </script>
</body>
</html>
