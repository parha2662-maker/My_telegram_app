<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* جلوگیری از اسکرول کل صفحه */
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
            flex-shrink: 0; /* فیکس شده */
        }
        .balance-box {
            background-color: #2a2a2a;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
            color: #00c853;
            font-size: 16px;
        }
        .reset-btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        /* نوار تاریخچه ضریب‌ها */
        .multiplier-history {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            overflow-x: auto;
            padding: 8px 10px;
            gap: 8px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
            white-space: nowrap;
            min-height: 45px;
            flex-shrink: 0; /* فیکس شده */
        }
        .history-badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            background-color: #2a2a2a;
            color: #ccc;
            flex-shrink: 0;
        }
        .history-badge.win { background-color: rgba(0, 200, 83, 0.2); color: #00c853; border: 1px solid rgba(0, 200, 83, 0.4); }
        .history-badge.loss { background-color: rgba(255, 68, 68, 0.2); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.4); }
        .history-badge.high { background-color: rgba(255, 204, 0, 0.2); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.4); }

        /* نمودار گرافیکی */
        .chart-container {
            width: 100%;
            height: 200px;
            background-color: #0a0a0a;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0; /* فیکس شده */
        }
        #chartCanvas {
            width: 100%;
            height: 100%;
        }
        .multiplier-text {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            color: #ffcc00;
            z-index: 10;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .multiplier-text.crashed {
            color: #ff4444;
        }

        /* بخش شرط‌بندی */
        .bet-controls {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #1e1e1e;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            flex-shrink: 0; /* فیکس شده */
        }
        .bet-input-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .bet-input {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 10px;
            width: 120px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        .action-btn {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-bet {
            background: linear-gradient(135deg, #1e90ff, #0056b3);
        }
        .btn-cashout {
            background: linear-gradient(135deg, #00c853, #009624);
        }

        /* لیست شرط‌بندی‌ها */
        .history-container {
            flex: 1; /* پر کردن فضای باقی‌مانده */
            min-height: 0; /* بسیار مهم برای اسکرول داخلی */
            overflow-y: auto; /* اسکرول فقط داخل این کادر */
            padding: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background-color: #1e1e1e;
            border-radius: 10px;
            margin-bottom: 5px;
            font-size: 13px;
            border: 1px solid #2a2a2a;
        }
        .avatar { width: 30px; height: 30px; border-radius: 50%; margin-left: 10px; }
        .user-info { display: flex; align-items: center; flex-grow: 1; }
        .user-name { color: #ccc; font-weight: bold; }
        .bet-amount { color: #ffcc00; margin-left: auto; }
        .multiplier-badge { padding: 3px 8px; border-radius: 5px; font-weight: bold; margin: 0 10px; min-width: 50px; text-align: center; }
        .win { background-color: rgba(0, 200, 83, 0.2); color: #00c853; }
        .loss { background-color: rgba(255, 68, 68, 0.2); color: #ff4444; }
        .profit { width: 60px; text-align: left; font-weight: bold; }
        
        /* انیمیشن */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div style="font-size:14px;">💰 موجودی:</div>
        <div class="balance-box" id="balanceDisplay">100.00 TON</div>
        <button class="reset-btn" onclick="resetBalance()">🔄 شارژ مجدد</button>
    </div>

    <div class="multiplier-history" id="multiplierHistory">
        <div style="font-size:12px; color:#666; padding-left:10px;">تاریخچه:</div>
    </div>

    <div class="chart-container">
        <div class="multiplier-text" id="multiplierDisplay">1.00x</div>
        <canvas id="chartCanvas"></canvas>
    </div>

    <div class="bet-controls">
        <div class="bet-input-row">
            <input type="number" id="betInput" class="bet-input" placeholder="مبلغ شرط" value="10" min="1">
            <span style="color:#888;">TON</span>
        </div>
        <button class="action-btn btn-bet" id="actionButton">ورود به بازی (Join)</button>
        <div style="text-align: center; font-size: 14px; color: #aaa; min-height: 20px;" id="statusText">برای شروع، مبلغ را وارد کنید</div>
    </div>

    <div class="history-container" id="historyList">
        <!-- لیست شرط‌بندی‌ها اینجا قرار می‌گیرد -->
    </div>

    <script>
        let balance = parseFloat(localStorage.getItem('crashBalance_v7')) || 100.00;
        let gameState = 'waiting'; 
        let multiplier = 1.00;
        let crashPoint = 0;
        let myBet = 0;
        let hasJoined = false;
        let gameInterval;
        let countdownInterval;
        let roundHistory = [];
        let players = []; 

        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const actionButton = document.getElementById('actionButton');
        const statusText = document.getElementById('statusText');
        const historyList = document.getElementById('historyList');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const betInput = document.getElementById('betInput');
        const multiplierHistoryContainer = document.getElementById('multiplierHistory');
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updateBalanceUI() {
            balanceDisplay.innerText = balance.toFixed(2) + ' TON';
            localStorage.setItem('crashBalance_v7', balance);
        }
        updateBalanceUI();

        function resetBalance() {
            balance = 100.00;
            updateBalanceUI();
            statusText.innerText = '✅ موجودی شما به 100 TON شارژ شد!';
        }

        // --- توابع کمکی ---
        
        // ۱. تابع تولید ضریب سقوط با تمایل به اعداد پایین‌تر
        function getRandomCrashPoint() {
            const rand = Math.random();
            // ۶۰٪ احتمال سقوط بین ۱.۰۱ تا ۲.۰۰
            if (rand < 0.6) return 1.01 + Math.random() * 1.0; 
            // ۳۰٪ احتمال سقوط بین ۲.۰۱ تا ۵.۰۰
            if (rand < 0.9) return 2.01 + Math.random() * 3.0; 
            // ۱۰٪ احتمال سقوط بالای ۵.۰۰
            return 5.01 + Math.random() * 5.0; 
        }

        // ۲. مدیریت نوار تاریخچه ضریب‌ها
        function addRoundToHistory(crashMultiplier) {
            roundHistory.unshift(crashMultiplier);
            if (roundHistory.length > 15) roundHistory.pop();
            renderRoundHistory();
        }

        function renderRoundHistory() {
            multiplierHistoryContainer.innerHTML = '<div style="font-size:12px; color:#666; padding-left:10px;">تاریخچه:</div>';
            roundHistory.forEach(m => {
                const badge = document.createElement('div');
                badge.className = 'history-badge';
                if (m >= 10) badge.classList.add('high');
                else if (m >= 1.5) badge.classList.add('win');
                else badge.classList.add('loss');
                badge.innerText = m.toFixed(2) + 'x';
                multiplierHistoryContainer.appendChild(badge);
            });
        }

        // ۳. مدیریت Canvas (نمودار)
        function drawChart(currentMultiplier) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const maxMultiplier = Math.max(crashPoint, currentMultiplier, 2); 
            const startX = 20;
            const startY = canvas.height - 20;
            const endX = canvas.width - 20;
            
            const progress = currentMultiplier / maxMultiplier;
            const currentX = startX + (endX - startX) * progress;
            const currentY = startY - (startY - 20) * (currentMultiplier / maxMultiplier);

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            const ctrlX = startX + (currentX - startX) * 0.5;
            const ctrlY = startY;
            ctx.quadraticCurveTo(ctrlX, ctrlY, currentX, currentY);
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffcc00';
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.beginPath();
            ctx.arc(currentX, currentY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        }

        function clearChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawChart(1.00);
        }

        // ۴. مدیریت بازیکنان
        const fakeNames = ['Ali', 'Reza', 'Sara', 'Mmd', 'Hossein', 'Zahra', 'Amir', 'Nima', 'Erfan', 'Melika', 'Kian', 'Matin', 'Yasin', 'Arya'];
        const fakeAvatars = ['🐸', '🐱', '⚽', '🦊', '🐻', '🐼', '🦁', '🐯', '🐨', '🐵'];

        function addPlayer(name, amount, isMe = false) {
            const avatar = isMe ? '👤' : fakeAvatars[Math.floor(Math.random() * fakeAvatars.length)];
            const player = {
                id: Date.now() + Math.random(),
                name: name,
                amount: amount,
                avatar: avatar,
                isMe: isMe,
                cashedOut: false
            };
            players.push(player);
            
            // محدود کردن تعداد بازیکنان به ۲۰ نفر
            if (players.length > 20) {
                players.splice(0, players.length - 20);
            }
            
            renderPlayers();
            return player.id;
        }

        function renderPlayers() {
            historyList.innerHTML = '';
            const sortedPlayers = [...players].reverse();
            sortedPlayers.forEach(p => {
                const item = document.createElement('div');
                item.className = 'history-item fade-in';
                if (p.isMe) item.style.border = '1px solid #ffcc00';

                let multiplierText = '-';
                let multiplierClass = '';
                let profitText = '-';
                let profitColor = '#ccc';

                if (p.cashedOut) {
                    multiplierText = p.cashoutMultiplier.toFixed(2) + 'x';
                    multiplierClass = 'win';
                    profitText = '+' + (p.amount * p.cashoutMultiplier).toFixed(2);
                    profitColor = '#00c853';
                } else if (p.lost) {
                    multiplierText = 'باخت';
                    multiplierClass = 'loss';
                    profitText = '-' + p.amount.toFixed(2);
                    profitColor = '#ff4444';
                }

                item.innerHTML = `
                    <div class="user-info">
                        <span style="font-size:20px; margin-left:5px;">${p.avatar}</span>
                        <span class="user-name">${p.name}</span>
                    </div>
                    <div class="bet-amount">${p.amount.toFixed(2)} TON</div>
                    <div class="multiplier-badge ${multiplierClass}">${multiplierText}</div>
                    <div class="profit" style="color: ${profitColor}">${profitText}</div>
                `;
                historyList.appendChild(item);
            });
        }

        function updatePlayersOnCrash() {
            players.forEach(p => {
                if (!p.cashedOut) {
                    p.lost = true;
                }
            });
            renderPlayers();
        }

        // تولید بازیکنان فیک به صورت کنترل‌شده (هر ۱ ثانیه یک نفر، شانس ۳۰٪)
        let fakeUserInterval = setInterval(() => {
            if (gameState === 'playing' && Math.random() > 0.7) {
                const name = fakeNames[Math.floor(Math.random() * fakeNames.length)] + Math.floor(Math.random() * 100);
                const amount = (Math.random() * 50 + 1);
                addPlayer(name, amount);
            }
        }, 1000);

        // شروع بازی
        function startNewRound() {
            gameState = 'waiting';
            hasJoined = false;
            myBet = 0;
            players = []; 
            renderPlayers();
            
            multiplier = 1.00;
            crashPoint = getRandomCrashPoint(); // استفاده از تابع جدید
            
            multiplierDisplay.innerText = '1.00x';
            multiplierDisplay.classList.remove('crashed');
            betInput.disabled = false;
            betInput.value = 10;
            
            actionButton.innerText = 'ورود به بازی (Join)';
            actionButton.className = 'action-btn btn-bet';
            actionButton.disabled = false;
            statusText.innerText = '⏳ برای ورود به بازی عجله کنید!';
            
            clearChart();
            
            let countdown = 5;
            statusText.innerText = `⏳ زمان باقی‌مانده: ${countdown} ثانیه`;
            
            countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    statusText.innerText = `⏳ زمان باقی‌مانده: ${countdown} ثانیه`;
                } else {
                    clearInterval(countdownInterval);
                    startGameplay();
                }
            }, 1000);
        }

        function startGameplay() {
            gameState = 'playing';
            betInput.disabled = true;
            
            if (hasJoined) {
                statusText.innerText = `✅ شما با ${myBet} TON وارد شدید. ضریب در حال افزایش...`;
                actionButton.innerText = 'برداشت (Cash Out)';
                actionButton.className = 'action-btn btn-cashout';
                actionButton.disabled = false;
            } else {
                statusText.innerText = 'شما وارد بازی نشدید! تماشا کنید...';
                actionButton.innerText = 'وارد نشدید';
                actionButton.className = 'action-btn btn-bet';
                actionButton.disabled = true;
            }

            // شروع با ۲ بازیکن فیک
            for(let i=0; i<2; i++) {
                const name = fakeNames[Math.floor(Math.random() * fakeNames.length)] + Math.floor(Math.random() * 100);
                addPlayer(name, (Math.random() * 50 + 1));
            }

            gameInterval = setInterval(() => {
                multiplier += 0.05; 
                multiplierDisplay.innerText = multiplier.toFixed(2) + 'x';
                drawChart(multiplier);
                
                // برداشت خودکار بازیکنان فیک
                players.forEach(p => {
                    if (!p.isMe && !p.cashedOut && !p.lost && Math.random() > 0.98) {
                        p.cashedOut = true;
                        p.cashoutMultiplier = multiplier;
                        renderPlayers();
                    }
                });
                
                if (multiplier >= crashPoint) {
                    clearInterval(gameInterval);
                    multiplierDisplay.innerText = crashPoint.toFixed(2) + 'x';
                    multiplierDisplay.classList.add('crashed');
                    gameState = 'crashed';
                    actionButton.disabled = true;
                    actionButton.innerText = 'دور بعد...';
                    actionButton.className = 'action-btn btn-bet';
                    
                    addRoundToHistory(crashPoint);
                    
                    if (hasJoined) {
                        statusText.innerText = `💥 سقوط کرد! شما ${myBet} TON باختید.`;
                    } else {
                        statusText.innerText = `💥 سقوط در ${crashPoint.toFixed(2)}x!`;
                    }
                    
                    updatePlayersOnCrash(); 
                    setTimeout(startNewRound, 2500);
                }
            }, 50);
        }

        function joinGame() {
            if (gameState !== 'waiting') return;
            
            const amount = parseFloat(betInput.value);
            if (isNaN(amount) || amount < 1) {
                statusText.innerText = '❌ لطفاً یک مبلغ معتبر وارد کنید!';
                return;
            }
            if (amount > balance) {
                statusText.innerText = '❌ موجودی کافی نیست!';
                return;
            }
            
            hasJoined = true;
            myBet = amount;
            balance -= amount;
            updateBalanceUI();
            betInput.disabled = true;
            
            addPlayer('شما (You)', amount, true);
            
            statusText.innerText = `✅ شما با ${amount} TON وارد بازی شدید! منتظر شروع...`;
            actionButton.innerText = 'منتظر شروع...';
            actionButton.disabled = true;
        }

        function cashOut() {
            if (!hasJoined || gameState !== 'playing') return;

            const winnings = myBet * multiplier;
            balance += winnings;
            updateBalanceUI();

            hasJoined = false; 
            actionButton.disabled = true;
            actionButton.innerText = 'دور بعد...';
            actionButton.className = 'action-btn btn-bet';
            
            statusText.innerText = `✅ بردید! ${myBet} × ${multiplier.toFixed(2)} = ${winnings.toFixed(2)} TON`;
            
            const myPlayer = players.find(p => p.isMe);
            if (myPlayer) {
                myPlayer.cashedOut = true;
                myPlayer.cashoutMultiplier = multiplier;
                renderPlayers();
            }
        }

        actionButton.addEventListener('click', () => {
            if (gameState === 'waiting') {
                joinGame();
            } else if (gameState === 'playing' && hasJoined) {
                cashOut();
            }
        });

        startNewRound();

    </script>
</body>
</html>
